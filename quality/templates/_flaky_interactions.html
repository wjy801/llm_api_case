{% if csrf_token %}
<dialog id="probe-dialog" aria-labelledby="probe-dialog-title">
  <form id="probe-form">
    <div class="dialog__head">
      <h2 id="probe-dialog-title">启动流水线验证</h2>
      <p>输入已经推送到 GitLab 的修复分支。系统会锁定该分支当前提交并创建 Probe，通过后才允许合并 dev3。</p>
    </div>
    <div class="dialog__body">
      <label for="probe-target">待验证用例</label>
      <div id="probe-target" class="field" style="min-height: auto; margin-bottom: 16px; overflow-wrap: anywhere;"></div>
      <label for="probe-branch">修复分支</label>
      <input id="probe-branch" class="field" required maxlength="200" pattern="[A-Za-z0-9][A-Za-z0-9._/-]*" placeholder="例如：fix/flaky-case" autocomplete="off" style="margin-bottom: 16px;">
      <label for="probe-reason">验证说明</label>
      <textarea id="probe-reason" class="field" required minlength="1" maxlength="500" placeholder="例如：修复已推送，申请合并前验证"></textarea>
      <p id="probe-status" class="action-status" role="status" aria-live="polite"></p>
      <div class="dialog__actions">
        <button class="button" id="probe-cancel" type="button">取消</button>
        <button class="button button--primary" id="probe-submit" type="submit">确认启动</button>
      </div>
    </div>
  </form>
</dialog>
{% endif %}
<div id="copy-toast" class="toast" role="status" hidden>已复制到剪贴板</div>
<script>
(() => {
  const toast = document.getElementById('copy-toast');
  let toastTimer;
  const showToast = (message) => {
    if (!toast) return;
    toast.textContent = message;
    toast.hidden = false;
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => { toast.hidden = true; }, 1800);
  };

  document.querySelectorAll('[data-copy-text]').forEach((button) => {
    button.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(button.dataset.copyText);
        showToast(button.dataset.copySuccess || '已复制到剪贴板');
      } catch (_error) {
        showToast('复制失败，请手动复制');
      }
    });
  });

  const dialog = document.getElementById('probe-dialog');
  if (!dialog) return;
  const form = document.getElementById('probe-form');
  const target = document.getElementById('probe-target');
  const branch = document.getElementById('probe-branch');
  const reason = document.getElementById('probe-reason');
  const status = document.getElementById('probe-status');
  const submit = document.getElementById('probe-submit');
  let governanceId = '';
  let rowVersion = 0;

  document.querySelectorAll('[data-probe-governance]').forEach((button) => {
    button.addEventListener('click', () => {
      governanceId = button.dataset.probeGovernance;
      rowVersion = Number(button.dataset.rowVersion);
      target.textContent = button.dataset.caseId;
      branch.value = '';
      reason.value = '';
      status.textContent = '';
      status.className = 'action-status';
      dialog.showModal();
      branch.focus();
    });
  });

  document.getElementById('probe-cancel').addEventListener('click', () => dialog.close());
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!branch.value.trim() || !reason.value.trim()) return;
    submit.disabled = true;
    status.textContent = '正在创建验证任务…';
    status.className = 'action-status';
    const csrf = document.querySelector('meta[name="flaky-probe-csrf"]').content;
    try {
      const response = await fetch(
        `/api/v1/governances/${encodeURIComponent(governanceId)}/probe-attempts`,
        {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrf},
          body: JSON.stringify({
            target_branch: branch.value.trim(),
            reason: reason.value.trim(),
            row_version: rowVersion,
            request_id: crypto.randomUUID()
          })
        }
      );
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        const messages = {
          attempt_already_active: '该用例已有进行中的验证任务',
          row_version_conflict: '治理状态已更新，请刷新后重试',
          probe_capacity_exhausted: '验证任务已达并发上限，请稍后重试',
          probe_trigger_disabled: '流水线验证开关已关闭',
          target_head_unavailable: '无法找到修复分支，请确认已推送到 GitLab',
          invalid_probe_request: '修复分支或验证说明格式不正确'
        };
        throw new Error(messages[payload?.error?.code] || '创建失败，请检查状态后重试');
      }
      status.textContent = '验证任务已创建，即将刷新状态…';
      window.setTimeout(() => window.location.reload(), 700);
    } catch (error) {
      status.textContent = error.message || '创建失败，请稍后重试';
      status.className = 'action-status action-status--error';
      submit.disabled = false;
    }
  });
})();
</script>
