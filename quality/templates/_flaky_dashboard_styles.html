<style>
  :root {
    color-scheme: light;
    --ink: #182230;
    --muted: #667085;
    --subtle: #98a2b3;
    --line: #e4e7ec;
    --soft: #f7f8fa;
    --panel: #ffffff;
    --navy: #172554;
    --indigo: #4f46e5;
    --indigo-soft: #eef2ff;
    --cyan-soft: #ecfeff;
    --green: #087443;
    --green-soft: #ecfdf3;
    --amber: #b54708;
    --amber-soft: #fffaeb;
    --red: #b42318;
    --red-soft: #fef3f2;
    --radius: 18px;
    --shadow: 0 12px 36px rgba(16, 24, 40, .07);
  }

  * { box-sizing: border-box; }
  html { min-width: 320px; background: #f5f7fb; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% -5%, rgba(79, 70, 229, .10), transparent 28rem),
      #f5f7fb;
    font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button, input, select { font: inherit; }
  code {
    font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    font-size: .9em;
  }

  .app-shell { width: min(1240px, calc(100% - 40px)); margin: 0 auto; }
  .topbar {
    position: sticky;
    z-index: 10;
    top: 0;
    border-bottom: 1px solid rgba(228, 231, 236, .9);
    background: rgba(255, 255, 255, .88);
    backdrop-filter: blur(14px);
  }
  .topbar__inner {
    min-height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .brand { display: flex; align-items: center; gap: 11px; font-weight: 760; }
  .brand__mark {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    color: white;
    background: linear-gradient(145deg, #6366f1, #3730a3);
    box-shadow: 0 7px 16px rgba(79, 70, 229, .24);
  }
  .brand__mark::before { content: "F"; font-size: 16px; }
  .brand small {
    padding: 3px 7px;
    border-radius: 999px;
    color: #4338ca;
    background: var(--indigo-soft);
    font-size: 11px;
    letter-spacing: .05em;
  }
  .nav { display: flex; align-items: center; gap: 8px; }
  .nav a {
    padding: 8px 12px;
    border-radius: 9px;
    color: #475467;
    font-size: 14px;
    font-weight: 650;
    text-decoration: none;
  }
  .nav a:hover, .nav a[aria-current="page"] { color: #3730a3; background: var(--indigo-soft); }

  main { padding: 42px 0 64px; }
  .eyebrow {
    margin: 0 0 8px;
    color: #4f46e5;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; }
  .hero h1 { margin: 0; font-size: clamp(30px, 4vw, 44px); line-height: 1.12; letter-spacing: -.035em; }
  .lede { max-width: 700px; margin: 13px 0 0; color: var(--muted); font-size: 16px; line-height: 1.7; }
  .as-of {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
  }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #12b76a; box-shadow: 0 0 0 4px #d1fadf; }

  .metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 30px; }
  .metric-card {
    min-height: 130px;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: rgba(255, 255, 255, .92);
    box-shadow: 0 5px 20px rgba(16, 24, 40, .035);
  }
  .metric-card__label { color: var(--muted); font-size: 13px; font-weight: 650; }
  .metric-card__value { margin-top: 10px; font-size: 32px; font-weight: 780; letter-spacing: -.04em; }
  .metric-card__hint { margin-top: 5px; color: var(--subtle); font-size: 12px; }
  .metric-card--attention .metric-card__value { color: var(--red); }
  .metric-card--progress .metric-card__value { color: var(--indigo); }
  .metric-card--success .metric-card__value { color: var(--green); }

  .overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
  .overview-card, .panel {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    box-shadow: 0 5px 20px rgba(16, 24, 40, .035);
  }
  .overview-card { padding: 20px; }
  .overview-card h2 { margin: 0 0 16px; font-size: 15px; }
  .state-list { display: flex; flex-wrap: wrap; gap: 10px; }
  .state-count {
    min-width: 116px;
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #eaecf0;
    border-radius: 12px;
    background: var(--soft);
  }
  .state-count strong { display: block; margin-top: 4px; font-size: 20px; }
  .state-count span { color: var(--muted); font-size: 12px; }

  .section { margin-top: 38px; }
  .section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
  .section-heading h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
  .section-heading p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .text-link { color: #4338ca; font-size: 14px; font-weight: 700; text-decoration: none; }
  .text-link:hover { text-decoration: underline; }

  .flow-guide { display: grid; grid-template-columns: repeat(4, 1fr); padding: 0; overflow: hidden; }
  .flow-guide__step { position: relative; min-height: 132px; padding: 20px; border-right: 1px solid var(--line); }
  .flow-guide__step:last-child { border-right: 0; }
  .flow-guide__number {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    margin-bottom: 14px;
    border-radius: 9px;
    color: #4338ca;
    background: var(--indigo-soft);
    font-size: 12px;
    font-weight: 800;
  }
  .flow-guide h3 { margin: 0; font-size: 14px; }
  .flow-guide p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }

  .case-list { display: grid; gap: 14px; }
  .case-card { padding: 22px; border-left: 4px solid #818cf8; }
  .case-card--overdue { border-left-color: #f04438; }
  .case-card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
  .case-card__title { margin: 0; font-size: 16px; line-height: 1.45; overflow-wrap: anywhere; }
  .case-card__title a { text-decoration: none; }
  .case-card__title a:hover { color: #4338ca; }
  .case-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 9px; color: var(--muted); font-size: 12px; }
  .case-card__status { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px;
    border: 1px solid transparent;
    border-radius: 999px;
    color: #344054;
    background: #f2f4f7;
    font-size: 11px;
    font-weight: 750;
    white-space: nowrap;
  }
  .status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #98a2b3; }
  .status--confirmed, .status--failed, .status--expired { color: var(--red); background: var(--red-soft); border-color: #fecdca; }
  .status--confirmed::before, .status--failed::before, .status--expired::before { background: #f04438; }
  .status--active, .status--suspected, .status--observing { color: var(--amber); background: var(--amber-soft); border-color: #fedf89; }
  .status--active::before, .status--suspected::before, .status--observing::before { background: #f79009; }
  .status--recovering, .status--ready_to_close { color: #4338ca; background: var(--indigo-soft); border-color: #c7d7fe; }
  .status--recovering::before, .status--ready_to_close::before { background: #6366f1; }
  .status--closed, .status--stable { color: var(--green); background: var(--green-soft); border-color: #abefc6; }
  .status--closed::before, .status--stable::before { background: #12b76a; }

  .workflow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 20px; }
  .workflow-step { min-height: 72px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fafafa; }
  .workflow-step__top { display: flex; align-items: center; gap: 8px; }
  .workflow-step__index { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; color: #667085; background: #eaecf0; font-size: 10px; font-weight: 800; }
  .workflow-step strong { font-size: 12px; }
  .workflow-step small { display: block; margin: 6px 0 0 28px; color: var(--muted); font-size: 11px; line-height: 1.4; }
  .workflow-step--done { border-color: #abefc6; background: var(--green-soft); }
  .workflow-step--done .workflow-step__index { color: white; background: #12b76a; }
  .workflow-step--current { border-color: #a4bcfd; background: var(--indigo-soft); }
  .workflow-step--current .workflow-step__index { color: white; background: var(--indigo); }
  .workflow-step--attention { border-color: #fecdca; background: var(--red-soft); }
  .workflow-step--attention .workflow-step__index { color: white; background: #f04438; }

  .evidence-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .progress { height: 7px; flex: 1; overflow: hidden; border-radius: 999px; background: #eaecf0; }
  .progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #6366f1, #22c55e); }
  .evidence-row small { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .case-card__footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 18px; padding-top: 16px; border-top: 1px solid #f0f1f3; }
  .action-hint { max-width: 610px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
  .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  .button {
    min-height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 13px;
    border: 1px solid #d0d5dd;
    border-radius: 10px;
    color: #344054;
    background: white;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
    font-size: 12px;
    font-weight: 720;
    text-decoration: none;
    cursor: pointer;
  }
  .button:hover { border-color: #98a2b3; background: #f9fafb; }
  .button--primary { color: white; border-color: var(--indigo); background: var(--indigo); }
  .button--primary:hover { border-color: #4338ca; background: #4338ca; }
  .button:disabled { color: #98a2b3; border-color: #eaecf0; background: #f9fafb; box-shadow: none; cursor: not-allowed; }

  .empty-state { padding: 46px 24px; text-align: center; }
  .empty-state__icon { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto 14px; border-radius: 15px; color: var(--green); background: var(--green-soft); font-size: 23px; }
  .empty-state h3 { margin: 0; font-size: 18px; }
  .empty-state p { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
  .notice { margin-top: 12px; padding: 12px 14px; border: 1px solid #fedf89; border-radius: 12px; color: #93370d; background: var(--amber-soft); font-size: 12px; }

  .filter-bar { display: grid; grid-template-columns: minmax(220px, 1fr) 180px 150px auto; gap: 10px; padding: 16px; margin-top: 26px; }
  .field { width: 100%; min-height: 40px; padding: 8px 11px; border: 1px solid #d0d5dd; border-radius: 10px; color: var(--ink); background: white; outline: none; }
  .field:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(99, 102, 241, .12); }

  .table-panel { overflow: hidden; }
  .data-table { width: 100%; border-collapse: collapse; }
  .data-table th { padding: 12px 16px; color: var(--muted); background: #f9fafb; font-size: 11px; font-weight: 750; text-align: left; text-transform: uppercase; letter-spacing: .04em; }
  .data-table td { padding: 15px 16px; border-top: 1px solid var(--line); font-size: 13px; vertical-align: middle; }
  .data-table tr:hover td { background: #fcfcfd; }
  .table-case { max-width: 360px; font-weight: 650; overflow-wrap: anywhere; }
  .table-case a { text-decoration: none; }
  .table-case a:hover { color: #4338ca; }
  .secondary-line { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; font-weight: 400; }

  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 28px; }
  .panel__head { padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .panel__head h2 { margin: 0; font-size: 16px; }
  .panel__body { padding: 20px; }
  .timeline { margin: 0; padding: 0; list-style: none; }
  .timeline li { position: relative; padding: 0 0 20px 24px; border-left: 1px solid #d0d5dd; }
  .timeline li:last-child { padding-bottom: 0; border-left-color: transparent; }
  .timeline li::before { content: ""; position: absolute; top: 2px; left: -5px; width: 9px; height: 9px; border-radius: 50%; background: #818cf8; box-shadow: 0 0 0 4px var(--indigo-soft); }
  .timeline strong { display: block; font-size: 13px; }
  .timeline span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
  .key-value { display: grid; grid-template-columns: 130px 1fr; gap: 10px 16px; margin: 0; font-size: 13px; }
  .key-value dt { color: var(--muted); }
  .key-value dd { margin: 0; overflow-wrap: anywhere; }

  dialog {
    width: min(520px, calc(100% - 32px));
    padding: 0;
    border: 0;
    border-radius: 18px;
    color: var(--ink);
    box-shadow: 0 28px 80px rgba(16, 24, 40, .28);
  }
  dialog::backdrop { background: rgba(15, 23, 42, .52); backdrop-filter: blur(3px); }
  .dialog__head { padding: 22px 24px 0; }
  .dialog__head h2 { margin: 0; font-size: 19px; }
  .dialog__head p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
  .dialog__body { padding: 20px 24px 24px; }
  .dialog__body label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 700; }
  textarea.field { min-height: 92px; resize: vertical; }
  .dialog__actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .action-status { min-height: 18px; margin: 10px 0 0; color: var(--muted); font-size: 12px; }
  .action-status--error { color: var(--red); }
  .toast {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 20;
    padding: 11px 14px;
    border-radius: 10px;
    color: white;
    background: #101828;
    box-shadow: var(--shadow);
    font-size: 12px;
  }

  @media (max-width: 900px) {
    .metric-grid, .flow-guide, .workflow { grid-template-columns: repeat(2, 1fr); }
    .flow-guide__step:nth-child(2) { border-right: 0; }
    .flow-guide__step:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    .overview-grid, .detail-grid { grid-template-columns: 1fr; }
    .filter-bar { grid-template-columns: 1fr 1fr; }
    .table-panel { overflow-x: auto; }
    .data-table { min-width: 900px; }
  }
  @media (max-width: 620px) {
    .app-shell { width: min(100% - 24px, 1240px); }
    .topbar__inner { min-height: 60px; }
    .brand small, .nav a:not([aria-current="page"]) { display: none; }
    main { padding-top: 28px; }
    .hero, .case-card__head, .case-card__footer { align-items: stretch; flex-direction: column; }
    .case-card__status, .actions { justify-content: flex-start; }
    .metric-grid, .flow-guide, .workflow, .filter-bar { grid-template-columns: 1fr; }
    .flow-guide__step { border-right: 0; border-bottom: 1px solid var(--line); }
    .flow-guide__step:last-child { border-bottom: 0; }
    .metric-card { min-height: 112px; }
    .key-value { grid-template-columns: 1fr; gap: 4px; }
    .key-value dd { margin-bottom: 8px; }
  }
</style>
