[pytest]
# Allure raw results are generated by pytest into allure-results.
# After pytest finishes, module/conftest.py automatically runs:
#   allure generate allure-results -o allure-report --clean
# Open HTML report:
#   allure open allure-report
addopts =
    --alluredir=allure-results
    --clean-alluredir
    --strict-markers
    -p governance.flaky_plugin
    -p pytester
testpaths = module
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    retry_once: allow one controlled retry for transient flaky scenarios
    flaky: pytest-rerunfailures marker used by retry_once
    flaky_governance: minimal test set for flaky governance development
